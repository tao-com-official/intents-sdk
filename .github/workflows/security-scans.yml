# Gitleaks, Semgrep and OSV scans: a copy of the jobs in tao-com-official/ci-workflows
# .github/workflows/security-scans.yml at 7ae5e02f5be1b15a7364cc661b5ce16971622d8e
# (security-scans-v0.1.0), with its default inputs filled in. This repo is public, and GitHub won't
# let a public repo call a reusable workflow from the private ci-workflows repo, so it can't use the
# shared caller the other repos use. The job names match the shared checks:
# `security-scans / gitleaks`, `security-scans / semgrep` and `security-scans / osv`. Once
# ci-workflows (or a public mirror of it) can be called from here, replace this file with the shared
# caller.
name: security-scans

on:
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]
  workflow_dispatch:
  # Weekly, so advisories published against packages already on main surface without a PR.
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read

jobs:
  gitleaks:
    name: security-scans / gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The open-source CLI: gitleaks/gitleaks-action needs a paid licence in an organisation.
      - name: Install Gitleaks
        env:
          GITLEAKS_VERSION: '8.30.1'
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64) arch=x64 ;;
            aarch64|arm64) arch=arm64 ;;
            *) echo "::error::No Gitleaks build for $(uname -m)."; exit 1 ;;
          esac
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_${arch}.tar.gz"
          curl -sSLf -o "$tarball" "$base/$tarball"
          curl -sSLf -o checksums.txt "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          # Verify before extracting. grep narrows the list to our asset so sha256sum can't pass on
          # an empty list.
          grep " ${tarball}\$" checksums.txt | sha256sum --check -
          tar -xzf "$tarball" gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          rm -f "$tarball" checksums.txt
          gitleaks version

      # Without --log-opts gitleaks runs `git log --all`, and fetch-depth 0 fetches every branch, so a
      # finding on someone else's unmerged branch would fail every PR. Scan the history of HEAD.
      - name: Scan for secrets
        run: >-
          gitleaks detect --source . --verbose --redact --no-banner
          --log-opts="--full-history --diff-filter=tuxdb HEAD"

  semgrep:
    name: security-scans / semgrep
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    container:
      # Pinned by digest so a re-pushed tag can't change what runs. Bump both together.
      image: semgrep/semgrep@sha256:65dcd4408adda7c183a6b4550cb1e9b19f7f627a6fbb7e0559bd466bedc44d7b # 1.172.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # OSS engine and Registry rules; no SEMGREP_APP_TOKEN. Actions are SHA-pinned, so the
      # mutable-tag rule is excluded as in the shared workflow.
      - name: Scan
        run: >-
          semgrep scan --config auto --error --quiet
          --exclude-rule yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag

  # On a PR or in the merge queue: fails only on advisories the change introduces (base vs head).
  # On a schedule or manual run: fails on any advisory.
  osv:
    name: security-scans / osv
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Pick the base to compare with
        id: base
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          MQ_BASE: ${{ github.event.merge_group.base_sha }}
        run: echo "sha=${PR_BASE:-$MQ_BASE}" >> "$GITHUB_OUTPUT"

      - name: Check out the base
        if: steps.base.outputs.sha != ''
        env:
          BASE: ${{ steps.base.outputs.sha }}
        run: git checkout -q "$BASE"

      - name: Scan the base
        id: scan-old
        if: steps.base.outputs.sha != ''
        continue-on-error: true
        uses: google/osv-scanner-action/osv-scanner-action@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
        env:
          GOTOOLCHAIN: auto
        with:
          scan-args: |-
            --format=json
            --output=old-results.json
            --allow-no-lockfiles
            -r
            ./

      - name: Check out the change
        if: steps.base.outputs.sha != ''
        run: git checkout -q -f "$GITHUB_SHA"

      - name: Scan the change
        id: scan-new
        continue-on-error: true
        uses: google/osv-scanner-action/osv-scanner-action@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
        env:
          GOTOOLCHAIN: auto
        with:
          scan-args: |-
            --format=json
            --output=new-results.json
            --allow-no-lockfiles
            -r
            ./

      # osv-scanner exits non-zero when it finds advisories, so the outcome alone can't tell a
      # finding from a crash. A scan that wrote no results is a crash: fail rather than pass.
      - name: Check the scans completed
        env:
          HAS_BASE: ${{ steps.base.outputs.sha != '' }}
        run: |
          status=0
          if [ "$HAS_BASE" = true ] && [ ! -s old-results.json ]; then
            echo "::error::OSV-Scanner wrote no results for the base. See 'Scan the base'."; status=1
          fi
          if [ ! -s new-results.json ]; then
            echo "::error::OSV-Scanner wrote no results for this change. See 'Scan the change'."; status=1
          fi
          exit "$status"

      - name: Report new advisories
        if: steps.base.outputs.sha != ''
        uses: google/osv-scanner-action/osv-reporter-action@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
        with:
          scan-args: |-
            --output=results.sarif
            --old=old-results.json
            --new=new-results.json
            --gh-annotations=true
            --fail-on-vuln=true

      - name: Report all advisories
        if: steps.base.outputs.sha == ''
        uses: google/osv-scanner-action/osv-reporter-action@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
        with:
          scan-args: |-
            --output=results.sarif
            --new=new-results.json
            --gh-annotations=true
            --fail-on-vuln=true
