# The Gitleaks, Semgrep and OSV scans, from the security-only public export of
# tao-com-official/ci-workflows (tao-com-official/ci-workflows-public); this repo can't call the
# private repo. The checks are `security-scans / gitleaks`, `security-scans / semgrep` and
# `security-scans / osv`, the same names as the copied jobs this replaces.
#
# PLACEHOLDER: replace PUBLIC_EXPORT_SHA with the ci-workflows-public commit that has the exported
# workflows. Until then this workflow can't run.
name: security-scans

on:
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]
  workflow_dispatch:
  # Weekly, so advisories published against packages already on main surface without a PR.
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read

jobs:
  security-scans:
    permissions:
      contents: read
    uses: tao-com-official/ci-workflows-public/.github/workflows/security-scans.yml@PUBLIC_EXPORT_SHA # export of security-scans-v0.1.0
    with:
      runs_on: ubuntu-24.04
