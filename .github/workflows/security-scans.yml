# The Gitleaks, Semgrep and OSV scans, from the security-only public export of
# tao-com-official/ci-workflows (tao-com-official/ci-workflows-public); this repo can't call the
# private repo. The checks are `security-scans / gitleaks`, `security-scans / semgrep` and
# `security-scans / osv`, the same names as the copied jobs this replaces.
name: security-scans

on:
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]
  workflow_dispatch:
  # Weekly, so advisories published against packages already on main surface without a PR.
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read

jobs:
  security-scans:
    permissions:
      contents: read
    uses: tao-com-official/ci-workflows-public/.github/workflows/security-scans.yml@a443501b93622507390d9307ab31d46060d090da # ci-workflows-public main (export of security-scans-v0.1.0)
    with:
      runs_on: ubuntu-24.04
