name: Publish to npm

# A person starts each release from `main` (Actions > Publish to npm > Run workflow on main). The job
# runs in the `release` environment, which only `main` can deploy to and whose required reviewers
# approve the publish. npm trusted publishing (OIDC) authenticates it; no npm token is stored.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    # Refuses to run from any other branch, before the environment even asks for approval.
    if: github.ref == 'refs/heads/main'
    environment: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing and the provenance statement
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm ci
      # prepublishOnly runs typechecking, tests, and the build.
      # --provenance: fail the publish rather than ship without a signed provenance statement.
      - run: npm publish --provenance
