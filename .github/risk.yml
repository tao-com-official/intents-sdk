# Path floor for the risk gate (tao-com-official/ci-workflows, risk-gate.yml). Read from the base
# branch, so a change here applies from the next PR. One High file makes a PR High; every file Low
# makes it Low (a file matching both a high and a low glob is High); anything else is Medium.
# .github/**, REVIEW.md and .claude/** are High even without this file.
high:
  # CI, publish and review config
  - .github/**
  - '{.claude,.agents,.codex,.cursor}/**'
  - '**/{REVIEW,AGENTS,CLAUDE}.md'
  # What gets published and how: package metadata, lifecycle scripts, dependencies, build config
  - package.json
  - package-lock.json
  - '{tsconfig.json,tsup.config.ts}'
  # What the wallet signs: approvals and open, the settler and token allowlist, order encoding,
  # swap floors, Substrate opens, unit conversion, calldata suffixes
  - src/client.ts
  - src/deployments.ts
  - src/config.ts
  - src/abi.ts
  - src/order-data.ts
  - src/swap.ts
  - src/alpha.ts
  - src/wst.ts
  - src/evm-call.ts
  - src/substrate.ts
  - src/substrate-signer.ts
  - src/attribution.ts
  - src/wallet.ts
  # Remote data that reaches a transaction
  - src/quoter.ts
low:
  - '**/*.md'
  - test/**
